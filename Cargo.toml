[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/openusage-storage", "crates/openusage-codex", "crates/openusage-import", "crates/openusage-locallogs", "crates/openusage-keys", "crates/openusage-cli"]
exclude = ["vendor/glib-0.18.5"]

# GTK3 requires glib 0.18. Keep the upstream memory-safety fix in this source tree.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

# Keep line-level debugging without retaining full dependency type information.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

# Optimize source verification without removing any executable checks.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

# RUSTSEC-2024-0429 manifests when the iterator is optimized.
[profile.test.package.glib]
opt-level = 2
