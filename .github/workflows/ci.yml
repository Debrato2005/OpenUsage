name: CI

# The same commands as scripts/engineering.py, run in full on Linux (OU-ENG-002 to OU-ENG-004).
# Windows and macOS join in S-15. Native GUI journeys stay a local gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs run in parallel, so one slow package mirror cannot push both past their limits.
jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The toolchain recorded in .tools/recovered-toolchain.json, from its official archive.
      RUST_VERSION: 1.99.1
      RUST_SHA256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
      # package.json engines and .nvmrc. The digest is the official bin/node binary.
      NODE_VERSION: 22.23.2
      NODE_BINARY_SHA256: 3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327
      # package.json packageManager. Digests are the official release archive (its SHASUMS256.txt) and its bun binary.
      BUN_VERSION: 1.3.14
      BUN_SHA256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
      BUN_BINARY_SHA256: 9fd36f87e4b90b07632b987a2e4ec81ca15a62c81bf983190cea6d715be2ad74
      # The reviewed Gitleaks in CONTRIBUTING.md. Digests are the official release archive (its checksums.txt) and its binary.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_BINARY_SHA256: 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; official ref verified
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; official ref verified
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: |
          set -euo pipefail
          name="rust-$RUST_VERSION-x86_64-unknown-linux-gnu"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$name.tar.xz" "https://static.rust-lang.org/dist/$name.tar.xz"
          echo "$RUST_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/install.sh" --prefix="$RUNNER_TEMP/rust" --disable-ldconfig \
            --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu,clippy-preview,rustfmt-preview
          echo "$RUNNER_TEMP/rust/bin" >> "$GITHUB_PATH"
      - name: Install pinned Node
        run: |
          set -euo pipefail
          name="node-v$NODE_VERSION-linux-x64"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$name.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$name.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/SHASUMS256.txt" "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt"
          (cd "$RUNNER_TEMP" && grep " $name.tar.xz\$" SHASUMS256.txt | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$NODE_BINARY_SHA256  $RUNNER_TEMP/$name/bin/node" | sha256sum -c -
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bun
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/bun-linux-x64.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun-linux-x64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun-linux-x64.zip" -d "$RUNNER_TEMP"
          echo "$BUN_BINARY_SHA256  $RUNNER_TEMP/bun-linux-x64/bun" | sha256sum -c -
          ln -s bun "$RUNNER_TEMP/bun-linux-x64/bunx"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      # The Git safety tests and hooks scan with the real secret scanner.
      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$name" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$name"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$GITLEAKS_BINARY_SHA256  $RUNNER_TEMP/gitleaks/gitleaks" | sha256sum -c -
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Install Linux build libraries
        run: |
          # Retry stalled mirror downloads instead of waiting on them.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libdbus-1-dev build-essential pkg-config perl
      - name: Report the environment
        run: python scripts/engineering.py doctor
      - name: Check dependency policy
        run: python scripts/dependency-policy.py
      - name: Check whitespace
        run: git diff --check HEAD^
      - name: Test engineering and storage tools
        run: python -m unittest discover -s tests/tools -p "test_*.py"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test Git safety
        run: node --test tests/tools/git-safety.test.mjs
      # TypeScript type check and the bundle that the desktop crate embeds.
      - name: Build renderer
        run: bun run build
      - name: Check IPC contracts
        run: bun run test:contract
      # The leaderboard Worker against SQLite, with no network.
      - name: Test leaderboard service
        run: bun run test:leaderboard
      - name: Check Rust format
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Includes the storage migration tests and the Codex provider-contract tests.
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      # The Pi experiment must compile and retain its qualification gates.
      - name: Test Pi qualification build
        run: |
          cargo test --locked -p openusage-locallogs --features pi-qualification detect::tests
          cargo clippy --locked -p openusage-desktop --features pi-native-qualification --all-targets -- -D warnings
          cargo test --locked -p openusage-desktop --features pi-native-qualification local_logs
      - name: Test Codex qualification build
        run: |
          cargo test --locked -p openusage-locallogs --features codex-qualification,pi-qualification
          cargo clippy --locked -p openusage-desktop --features codex-native-qualification,pi-native-qualification --all-targets -- -D warnings
          cargo test --locked -p openusage-desktop --features codex-native-qualification,pi-native-qualification local_logs
      - name: Test native oracles
        run: cargo test --locked --manifest-path tests/native/backup-verifier/Cargo.toml

  renderer:
    name: Renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_VERSION: 22.23.2
      NODE_BINARY_SHA256: 3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327
      BUN_VERSION: 1.3.14
      BUN_SHA256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
      BUN_BINARY_SHA256: 9fd36f87e4b90b07632b987a2e4ec81ca15a62c81bf983190cea6d715be2ad74
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; official ref verified
        with:
          persist-credentials: false
      - name: Install pinned Node
        run: |
          set -euo pipefail
          name="node-v$NODE_VERSION-linux-x64"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$name.tar.xz" "https://nodejs.org/dist/v$NODE_VERSION/$name.tar.xz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/SHASUMS256.txt" "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt"
          (cd "$RUNNER_TEMP" && grep " $name.tar.xz\$" SHASUMS256.txt | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$NODE_BINARY_SHA256  $RUNNER_TEMP/$name/bin/node" | sha256sum -c -
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Install pinned Bun
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/bun-linux-x64.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun-linux-x64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun-linux-x64.zip" -d "$RUNNER_TEMP"
          echo "$BUN_BINARY_SHA256  $RUNNER_TEMP/bun-linux-x64/bun" | sha256sum -c -
          ln -s bun "$RUNNER_TEMP/bun-linux-x64/bunx"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install renderer browsers
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          bunx playwright install --with-deps chromium webkit
      # Both engines, with axe accessibility checks in light and dark themes.
      - name: Test renderer
        run: bun run test:renderer
