[package]
name = "openusage-board"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
jiff = "=0.2.38"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-vendored"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"
