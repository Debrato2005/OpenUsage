[package]
name = "openusage-locallogs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

# Runs the pinned ccusage binary against local logs and parses its report (SRS Section 5C).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
