[package]
name = "openusage-keys"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

# The database key in the OS credential store, shared by the desktop app and the CLI (SRS Section 12.2).
[dependencies]
keyring-core = "=1.0.1"
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[features]
default = []
# Native journeys use a separate credential namespace.
native-test = []
