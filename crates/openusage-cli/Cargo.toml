[package]
name = "openusage-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

# The openusage command (SRS Section 11A). It has no webview dependency (OU-CLI-001).
[[bin]]
name = "openusage"
path = "src/main.rs"

[dependencies]
jiff = "=0.2.38"
openusage-keys = { path = "../openusage-keys" }
openusage-locallogs = { path = "../openusage-locallogs" }
openusage-storage = { path = "../openusage-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
zeroize = "=1.9.1"

[features]
default = []
# Native journeys read the separate native-test credential namespace.
native-test = ["openusage-keys/native-test"]
