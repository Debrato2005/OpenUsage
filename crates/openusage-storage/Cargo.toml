[package]
name = "openusage-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
libc = "0.2"
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "serialize", "limits", "hooks"] }
uuid = { version = "=1.28.0", default-features = false }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
