[package]
name = "openusage-desktop"
version = "0.1.0"
description = "OpenUsage native desktop application"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
