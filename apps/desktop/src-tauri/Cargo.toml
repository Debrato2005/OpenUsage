[package]
name = "openusage-desktop"
version = "0.1.0"
description = "OpenUsage native desktop application"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
getrandom = "=0.4.3"
jiff = "=0.2.38"
keyring-core = "=1.0.1"
libc = "=0.2.191"
open = { version = "=5.4.4", features = ["shellexecute-on-windows"] }
openusage-codex = { path = "../../../crates/openusage-codex" }
sha2 = "=0.10.9"
openusage-import = { path = "../../../crates/openusage-import" }
openusage-storage = { path = "../../../crates/openusage-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", default-features = false }
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "=1.53.3", features = ["time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "=4.18.0"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "=4.18.0"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-test = ["openusage-storage/native-test"]
