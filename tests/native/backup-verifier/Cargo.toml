[package]
name = "openusage-native-backup-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[dependencies]
openusage-import = { path = "../../../crates/openusage-import" }
openusage-storage = { path = "../../../crates/openusage-storage" }
serde_json = "=1.0.154"
libc = "=0.2.191"
rusqlite = { version = "=0.40.1", features = ["bundled-sqlcipher-vendored-openssl", "serialize"] }
zeroize = "=1.9.1"
